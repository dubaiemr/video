<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>يوم العلم</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; cursor:none; }
  video { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; background:#000; }
  video::-webkit-media-controls, video::-webkit-media-controls-enclosure,
  video::-webkit-media-controls-panel, video::-webkit-media-controls-start-playback-button { display:none !important; -webkit-appearance:none; }
</style>
</head>
<body>
<video id="v" src="flag_day.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"
       disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
<script>
(function () {
  var v = document.getElementById('v');
  v.controls = false;

  function play() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }

  // keep looping even on browsers where the loop attribute is unreliable
  v.addEventListener('ended', function () { v.currentTime = 0; play(); });
  v.addEventListener('error', function () { setTimeout(function () { v.load(); play(); }, 3000); });
  v.addEventListener('stalled', function () { setTimeout(play, 1500); });

  // watchdog: restart if playback stops for any reason
  setInterval(function () { if (v.paused || v.ended) play(); }, 4000);

  // first tap: go fullscreen and unmute (browsers only allow this after a touch/click)
  var armed = true;
  function enter() {
    if (!armed) return;
    armed = false;
    var el = document.documentElement;
    var rq = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    try { if (rq) rq.call(el); } catch (e) {}
    v.muted = false;
    play();
  }
  document.addEventListener('click', enter);
  document.addEventListener('touchend', enter);
  document.addEventListener('keydown', enter);

  // block context menu / selection / dragging
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  // optional: ?mute=0 in the address starts with sound where allowed
  play();
})();
</script>
</body>
</html>
